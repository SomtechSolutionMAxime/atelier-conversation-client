    const { className = '', size = 24, ...rest } = props || {};
    return React.createElement('svg', {
      xmlns: 'http://www.w3.org/2000/svg',
      width: size, height: size, viewBox: '0 0 24 24',
      fill: 'none', stroke: 'currentColor', strokeWidth: 2,
      strokeLinecap: 'round', strokeLinejoin: 'round',
      className: className, ...rest
    }, ...paths.map((p, i) => {
      if (typeof p === 'string') return React.createElement('path', { key: i, d: p });
      return React.createElement(p.tag, { key: i, ...p.attrs });
    }));
  };
};

          el('div', { className:'h-6 w-20 bg-slate-500 rounded' }),
          el('div', { className:'h-6 w-20 bg-slate-600 rounded' }),
          el('div', { className:'h-6 w-20 bg-slate-600 rounded' })))
    : el('div', { className:'bg-slate-800 rounded-md p-3' },
        el('div', { className:'h-4 w-1/2 bg-slate-500 rounded' }));

        el('div', { className:'h-14 bg-white border border-slate-200 rounded' })),
      el('div', { className:'h-20 bg-white border border-slate-200 rounded' })));
}

function Etiq({ t, c }) {

}

// ============================================================
// COLONNE GAUCHE — la conversation (reconstruite, pas encastrée)

function Bandeau() {
  return el('div', { className:'flex items-start gap-2 bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-[11px] leading-snug text-amber-900' },

function Message({ m, actif, ouvert, onClick }) {
  const estClient = m.qui === 'client';
  const st = STYLE_TYPE[ONGLETS[m.onglet].type];
  return el('button', {
    onClick: onClick,
    title: 'Ouvrir « ' + ONGLETS[m.onglet].court +' » dans un onglet à droite',

            el('p', { className:'text-[10px] uppercase tracking-wide font-semibold text-slate-400' }, st.l),
            el('h3', { className:'text-[16px] font-semibold text-slate-900 leading-tight' }, o.titre),
            el('p', { className:'text-[11px] text-slate-500 mt-0.5' }, o.meta)),
          el('button', {
            onClick: () => allerAuMessage(o.ancre),
            className:'shrink-0 inline-flex items-center gap-1.5 text-[11px] text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full px-3 py-1.5 hover:bg-indigo-100'
          }, el(CornerUpLeft, { size:12 }), o.ancreTexte))),
      el('div', { className:'p-5' }, o.rendu),
      el('div', { className:'flex items-start gap-2 text-[11px] text-slate-500 px-5 pb-5' },
        el(Info, { size:14, className:'shrink-0 mt-0.5' }),
        el('p', null, 'Rien de cet onglet n’est publié dans le canal. Pour que le client en voie une trace, il faut le lui envoyer comme message — geste explicite.')))
      : el('div', { className:'flex-1 flex flex-col items-center justify-center text-center gap-2 p-8' },
        el('p', { className:'text-[14px] text-slate-500' }, 'Aucun onglet ouvert.'),
        el('p', { className:'text-[12px] text-slate-400' }, 'Cliquez un message à gauche, ou le « + » de la barre d’onglets.'))
  );
}

// ============================================================
// LE TELEPHONE DU CLIENT
// ============================================================
function Telephone({ onClose }) {
  return el('aside', { className:'w-[330px] shrink-0 bg-slate-900 flex flex-col items-center justify-center p-5 gap-3' },
    el('div', { className:'w-full flex items-center justify-between' },
      el('p', { className:'text-[11px] uppercase tracking-wide text-slate-400 font-semibold' }, 'Chez le client'),
      el('button', { onClick:onClose, className:'text-slate-500 hover:text-slate-200' }, el(X, { size:16 }))),
    el('div', { className:'w-[250px] h-[500px] bg-slate-950 rounded-[2rem] border-4 border-slate-700 p-2 flex flex-col overflow-hidden' },
      el('div', { className:'flex items-center gap-1.5 px-2 py-2 border-b border-slate-800' },
        el(Hash, { size:13, className:'text-slate-500' }),
        el('span', { className:'text-[12px] font-semibold text-slate-200 truncate' }, CANAL)),
      el('div', { className:'flex-1 overflow-y-auto py-2 space-y-2.5 px-1' },
        MESSAGES.map(m => el('div', { key:m.id, className:'flex gap-1.5' },
          el('div', { className:'shrink-0 h-5 w-5 rounded text-[8px] font-bold text-white flex items-center justify-center ' + (m.qui === 'client' ? 'bg-emerald-600' : 'bg-slate-600') },
            m.nom.split(' ').map(x => x[0]).join('')),
          el('div', { className:'min-w-0' },
            el('p', { className:'text-[10px] text-slate-400' }, m.nom.split(' ')[0] + ' · ' + m.h),
            el('p', { className:'text-[11px] text-slate-200 leading-snug' }, m.texte),
            m.piece ? el('p', { className:'text-[10px] text-sky-400 mt-1 truncate' }, 'pièce jointe : ' + m.piece) : null)))),
      el('div', { className:'border-t border-slate-800 px-2 py-2 text-[10px] text-slate-600' }, 'Message…')),
    el('p', { className:'text-[11px] text-slate-400 text-center leading-snug' },
      'Slack, tel quel, sur son téléphone. ',
      el('span', { className:'text-slate-200 font-medium' }, 'Ni les onglets, ni les billets, ni les maquettes ne lui parviennent'),
      ' — sauf si on les lui envoie en message.')
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [ouverts, setOuverts] = useState(['doc-cahier', 'billet-42', 'maq-accueil']);
  const [actif, setActif] = useState('doc-cahier');
  const [tel, setTel] = useState(true);
  const msgRefs = useRef({});

  const allerAuMessage = (id) => {
    const n = msgRefs.current[id];
    if (n && n.scrollIntoView) n.scrollIntoView({ behavior:'smooth', block:'center' });
  };

  const ouvrirOnglet = (k) => {
    setOuverts(prev => prev.indexOf(k) === -1 ? prev.concat([k]) : prev);
    setActif(k);
  };

  const fermer = (k) => {
    const reste = ouverts.filter(x => x !== k);
    setOuverts(reste);
    if (actif === k) setActif(reste.length ? reste[reste.length - 1] : null);
  };

  return el('div', { className:'h-screen flex flex-col' },
    el('header', { className:'shrink-0 bg-slate-900 text-white px-5 py-3 flex items-center gap-4' },
      el('div', { className:'min-w-0' },
        el('h1', { className:'font-semibold text-[15px]' }, 'Atelier de conversation client'),
        el('p', { className:'text-[11px] text-slate-400' }, 'Croquis d’écran — Slack reste le lien avec le client, on lui met un écran autour')),
      el('span', { className:'ml-auto text-[10px] uppercase tracking-wide bg-amber-400 text-amber-950 font-bold rounded px-2 py-1' }, 'Croquis · aucune intégration'),
      el('button', {
        onClick: () => setTel(!tel),
        className:'inline-flex items-center gap-1.5 text-[12px] rounded-lg px-3 py-1.5 border transition ' +
          (tel ? 'bg-white text-slate-900 border-white' : 'border-slate-600 text-slate-200 hover:border-slate-400')
      }, el(tel ? Eye : Smartphone, { size:14 }), tel ? 'Vue client affichée' : 'Voir ce que le client voit')),
    el('div', { className:'flex-1 flex overflow-hidden' },
      el(Conversation, { actifOnglet: actif, ouverts, ouvrirOnglet, msgRefs }),
      el(PanneauContexte, { ouverts, actif, setActif, fermer, ouvrirOnglet, allerAuMessage }),
      tel ? el(Telephone, { onClose: () => setTel(false) }) : null),
    el('footer', { className:'shrink-0 bg-white border-t border-slate-200 px-5 py-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-500' },
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-emerald-500' }), 'Gauche : la conversation, reconstruite par nous à partir du canal'),
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-indigo-500' }), 'Droite : nos onglets de contexte, invisibles pour le client'),
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-slate-400' }), 'Données entièrement fictives'))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App, null));
  </script>
</body>
</html>
