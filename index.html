const createIcon = (paths) => {
  return function IconComponent(props) {
    const { className = '', size = 24, ...rest } = props || {};
    return React.createElement('svg', {
      xmlns: 'http://www.w3.org/2000/svg',
      width: size, height: size, viewBox: '0 0 24 24',
      fill: 'none', stroke: 'currentColor', strokeWidth: 2,
      strokeLinecap: 'round', strokeLinejoin: 'round',
      className: className, ...rest
    }, ...paths.map((p, i) => {
      if (typeof p === 'string') return React.createElement('path', { key: i, d: p });
      return React.createElement(p.tag, { key: i, ...p.attrs });
    }));
  };
};

          el('div', { className:'h-6 w-20 bg-slate-600 rounded' }),
          el('div', { className:'h-6 w-20 bg-slate-600 rounded' })))
    : el('div', { className:'bg-slate-800 rounded-md p-3 space-y-2' },
        el('div', { className:'h-4 w-1/2 bg-slate-500 rounded' }),
        el('div', { className:'h-6 w-24 bg-slate-600 rounded' }));
  return el('div', { className:'flex-1 min-w-0' },
    el('div', { className:'flex items-center gap-2 mb-1.5' },
      el('span', { className:'text-[11px] font-semibold text-slate-600' }, variante === 1 ? 'v1 — actuelle' : 'v2 — bandeau allégé'),

        el('div', { className:'h-14 bg-white border border-slate-200 rounded' })),
      el('div', { className:'h-16 bg-white border border-slate-200 rounded' })));
}

// ============================================================
// COLONNE GAUCHE — la conversation (la même que dans Slack)
// ============================================================
function Message({ m, actif, ouvert, onClick }) {
  const st = STYLE_TYPE[ONGLETS[m.onglet].type];
  return el('div', {
    onClick: onClick,
    title: 'Ouvrir « ' + ONGLETS[m.onglet].court + ' » à droite',
    className: 'group cursor-pointer px-4 py-2.5 border-l-2 transition ' +
      (actif ? 'border-slate-400 bg-slate-50 ' : 'border-transparent hover:bg-slate-50/70 ')
  },
    el('div', { className:'flex gap-2.5' },
      el('div', { className:'shrink-0 h-8 w-8 rounded-md flex items-center justify-center text-[11px] font-bold text-white ' + (m.moi ? 'bg-slate-700' : 'bg-teal-600') },
        m.nom.split(' ').map(function (x) { return x[0]; }).join('')),
      el('div', { className:'min-w-0 flex-1' },
        el('div', { className:'flex items-baseline gap-2' },

          el('span', { className:'text-[12px] text-slate-700' }, m.piece)) : null,

}

function Conversation({ actifOnglet, ouverts, ouvrirOnglet, msgRefs }) {
  const nouveaux = MESSAGES.filter(function (m) { return m.nouveau; });
  const premierNouveau = nouveaux.length ? nouveaux[0] : null;
  return el('section', { className:'w-[430px] shrink-0 flex flex-col bg-white border-r border-slate-200' },
    el('header', { className:'px-4 py-3 border-b border-slate-200' },
      el('div', { className:'flex items-center gap-2' },
        el(MessageSquare, { size:16, className:'text-slate-400' }),
        el('h2', { className:'font-semibold text-slate-900 text-[15px]' }, 'Conversation avec Somtech'),
        el('span', { className:'ml-auto text-[10px] bg-rose-500 text-white rounded-full px-2 py-0.5 font-semibold' }, '3 non lus')),
      el('div', { className:'flex items-center gap-1.5 mt-1' },
        el(Smartphone, { size:12, className:'text-slate-400' }),
        el('p', { className:'text-[11px] text-slate-500' }, 'Aussi disponible dans Slack — c’est le même fil.'))),
    el('div', { className:'flex-1 overflow-y-auto py-2' },
      MESSAGES.map(function (m) {

              el('span', { className:'h-px flex-1 bg-rose-200' }),
              el('span', { className:'text-[10px] font-semibold text-rose-500 uppercase tracking-wide' }, 'nouveaux messages'),
              el('span', { className:'h-px flex-1 bg-rose-200' }))
          : null;
        return el('div', { key:m.id, ref: function (n) { msgRefs.current[m.id] = n; } },
          sep,
          el(Message, {
            m: m,
            actif: m.onglet === actifOnglet,
            ouvert: ouverts.indexOf(m.onglet) !== -1,
            onClick: function () { ouvrirOnglet(m.onglet); }
          }));
      })),
    el('div', { className:'p-3 border-t border-slate-200' },
      el('div', { className:'flex items-center gap-2 border border-slate-300 rounded-lg px-3 py-2' },
        el('span', { className:'flex-1 text-[13px] text-slate-400' }, 'Écrire à Camille…'),
        el(Send, { size:16, className:'text-slate-400' })),
      el('div', { className:'flex items-center gap-2 mt-2' },
        el('p', { className:'text-[10px] text-slate-500 leading-snug flex-1' },
          'Ce que vous écrivez ici part dans la conversation Slack, sous votre nom, comme un message ordinaire.'),
        el('span', { className:'shrink-0 inline-flex items-center gap-1 text-[11px] text-slate-600 border border-slate-300 rounded-lg px-2.5 py-1.5' },
          el(ExternalLink, { size:12 }), 'Ouvrir dans Slack')))
  );
}

// ============================================================

// ============================================================
function BarreOnglets({ ouverts, actif, setActif, fermer, ouvrirOnglet }) {
  const fermes = Object.keys(ONGLETS).filter(function (k) { return ouverts.indexOf(k) === -1; });
  const [menu, setMenu] = useState(false);
  return el('div', { className:'relative bg-slate-200/70 border-b border-slate-300' },
    el('div', { className:'flex items-end gap-1 px-2 pt-2 overflow-x-auto' },
      ouverts.map(function (k) {
        const o = ONGLETS[k];
        const st = STYLE_TYPE[o.type];
        const estActif = k === actif;
        return el('div', {
          key:k,
          onClick: function () { setActif(k); },
          className: 'group flex items-center gap-2 max-w-[230px] shrink-0 rounded-t-lg px-3 py-2 cursor-pointer border border-b-0 transition ' +
            (estActif
              ? 'bg-white border-slate-300 text-slate-900 shadow-[0_-3px_0_0_rgba(13,148,136,1)_inset]'
              : 'bg-slate-100/80 border-transparent text-slate-500 hover:bg-slate-100')
        },
          el(st.i, { size:14, className: estActif ? st.c : 'text-slate-400' }),
          el('span', { className:'text-[12px] truncate ' + (estActif ? 'font-semibold' : '') }, o.court),
          el('span', {
            onClick: function (e) { e.stopPropagation(); fermer(k); },
            className:'shrink-0 rounded p-0.5 text-slate-400 hover:bg-slate-200 hover:text-slate-700 ' + (estActif ? '' : 'opacity-0 group-hover:opacity-100')
          }, el(X, { size:12 })));
      }),
      el('button', {
        onClick: function () { setMenu(!menu); },
        title:'Ouvrir un autre document',
        className:'shrink-0 mb-1 ml-1 rounded p-1.5 text-slate-500 hover:bg-slate-300/70'
      }, el(Plus, { size:15 }))),
    menu ? el('div', { className:'absolute right-2 top-full z-20 w-72 bg-white border border-slate-200 rounded-xl shadow-lg p-1.5' },
      el('p', { className:'text-[10px] uppercase tracking-wide text-slate-400 px-2 py-1.5' }, 'Vos documents'),
      fermes.map(function (k) {
        const st = STYLE_TYPE[ONGLETS[k].type];
        return el('button', {
          key:k,
          onClick: function () { ouvrirOnglet(k); setMenu(false); },
          className:'w-full flex items-center gap-2 text-left px-2 py-2 rounded-lg hover:bg-slate-50'
        }, el(st.i, { size:14, className: st.c }),
           el('span', { className:'text-[12px] text-slate-700 truncate' }, ONGLETS[k].court));
      }),
      fermes.length === 0 ? el('p', { className:'text-[12px] text-slate-400 px-2 py-2' }, 'Tout est déjà ouvert.') : null,
      el('p', { className:'text-[10px] text-slate-400 px-2 py-1.5 border-t border-slate-100 mt-1' }, 'Croquis : la liste est figée.')) : null
  );
}

  const st = o ? STYLE_TYPE[o.type] : null;

      el('div', { className:'bg-white border-b border-slate-200 px-5 py-4' },
        el('div', { className:'flex items-start gap-3' },
          el('div', { className:'h-10 w-10 rounded-lg flex items-center justify-center shrink-0 ' + st.b }, el(st.i, { size:19 })),
          el('div', { className:'min-w-0 flex-1' },
            el('p', { className:'text-[10px] uppercase tracking-wide font-semibold text-slate-400' }, st.l),
            el('h3', { className:'text-[16px] font-semibold text-slate-900 leading-tight' }, o.titre),
            el('p', { className:'text-[11px] text-slate-500 mt-0.5' }, o.meta)),
          el('button', {
            onClick: function () { allerAuMessage(o.ancre); },
            className:'shrink-0 inline-flex items-center gap-1.5 text-[11px] text-slate-600 bg-slate-100 border border-slate-200 rounded-full px-3 py-1.5 hover:bg-slate-200'
          }, el(Reply, { size:12 }), o.ancreTexte))),
      el('div', { className:'p-5' }, o.rendu),
      el('div', { className:'px-5 pb-6' },
        el('span', { className:'inline-flex items-center gap-1.5 text-[12px] text-slate-600 border border-slate-300 rounded-lg px-3 py-2 bg-white' },
          el(Share, { size:13 }), 'Partager ce document dans la conversation')))
      : el('div', { className:'flex-1 flex flex-col items-center justify-center text-center gap-2 p-8' },
        el('p', { className:'text-[14px] text-slate-500' }, 'Aucun document ouvert.'),
        el('p', { className:'text-[12px] text-slate-400' }, 'Cliquez un message à gauche, ou le « + » de la barre d’onglets.'))
  );
}

// ============================================================
// LE MEME FIL, DANS SLACK
// ============================================================
function Telephone({ onClose }) {
  return el('aside', { className:'w-[330px] shrink-0 bg-slate-900 flex flex-col items-center justify-center p-5 gap-3' },
    el('div', { className:'w-full flex items-center justify-between' },
      el('p', { className:'text-[11px] uppercase tracking-wide text-slate-400 font-semibold' }, 'Le même fil, dans Slack'),
      el('button', { onClick:onClose, className:'text-slate-500 hover:text-slate-200' }, el(X, { size:16 }))),
    el('div', { className:'w-[250px] h-[500px] bg-slate-950 rounded-[2rem] border-4 border-slate-700 p-2 flex flex-col overflow-hidden' },
      el('div', { className:'flex items-center gap-1.5 px-2 py-2 border-b border-slate-800' },
        el(MessageSquare, { size:13, className:'text-slate-500' }),
        el('span', { className:'text-[12px] font-semibold text-slate-200 truncate' }, 'verdelune-x-somtech')),
      el('div', { className:'flex-1 overflow-y-auto py-2 space-y-2.5 px-1' },
        MESSAGES.map(function (m) {
          return el('div', { key:m.id, className:'flex gap-1.5' },
            el('div', { className:'shrink-0 h-5 w-5 rounded text-[8px] font-bold text-white flex items-center justify-center ' + (m.moi ? 'bg-slate-600' : 'bg-teal-600') },
              m.nom.split(' ').map(function (x) { return x[0]; }).join('')),
            el('div', { className:'min-w-0' },
              el('p', { className:'text-[10px] text-slate-400' }, m.nom.split(' ')[0] + ' · ' + m.h),
              el('p', { className:'text-[11px] text-slate-200 leading-snug' }, m.texte),
              m.piece ? el('p', { className:'text-[10px] text-sky-400 mt-1 truncate' }, 'pièce jointe : ' + m.piece) : null));
        })),
      el('div', { className:'border-t border-slate-800 px-2 py-2 text-[10px] text-slate-600' }, 'Message…')),
    el('p', { className:'text-[11px] text-slate-400 text-center leading-snug' },
      el('span', { className:'text-slate-200 font-medium' }, 'Une seule conversation, deux portes.'),
      ' Ce qui est écrit ici part dans Slack, et ce qui est écrit dans Slack apparaît ici. Le client garde Slack sur son téléphone.')
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [ouverts, setOuverts] = useState(['cahier', 'compte-rendu', 'maquette']);
  const [actif, setActif] = useState('cahier');
  const [tel, setTel] = useState(true);
  const msgRefs = useRef({});

  const allerAuMessage = function (id) {
    const n = msgRefs.current[id];
    if (n && n.scrollIntoView) n.scrollIntoView({ behavior:'smooth', block:'center' });
  };

  const ouvrirOnglet = function (k) {
    setOuverts(function (prev) { return prev.indexOf(k) === -1 ? prev.concat([k]) : prev; });
    setActif(k);
  };

  const fermer = function (k) {
    const reste = ouverts.filter(function (x) { return x !== k; });
    setOuverts(reste);
    if (actif === k) setActif(reste.length ? reste[reste.length - 1] : null);
  };

  return el('div', { className:'h-screen flex flex-col' },
    el('header', { className:'shrink-0 bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-4' },
      el('div', { className:'flex items-center gap-2 min-w-0' },
        el('div', { className:'h-7 w-7 rounded-md bg-teal-600 text-white flex items-center justify-center text-[12px] font-bold' }, 'V'),
        el('div', { className:'min-w-0' },
          el('p', { className:'text-[13px] font-semibold text-slate-900 leading-tight' }, ESPACE),
          el('p', { className:'text-[10px] text-slate-500' }, 'Espace de travail'))),
      el('nav', { className:'flex items-center gap-1 ml-4' },
        el('span', { className:'text-[12px] text-slate-500 rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5' }, el(Folder, { size:13 }), 'Documents'),
        el('span', { className:'text-[12px] font-semibold text-slate-900 bg-slate-100 rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5' }, el(MessageSquare, { size:13 }), 'Conversation'),
        el('span', { className:'text-[12px] text-slate-500 rounded-lg px-3 py-1.5 inline-flex items-center gap-1.5' }, el(LayoutIcon, { size:13 }), 'Maquettes')),
      el('span', { className:'ml-auto text-[10px] uppercase tracking-wide bg-amber-400 text-amber-950 font-bold rounded px-2 py-1' }, 'Croquis'),
      el('button', {
        onClick: function () { setTel(!tel); },
        className:'inline-flex items-center gap-1.5 text-[12px] rounded-lg px-3 py-1.5 border transition ' +
          (tel ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-300 text-slate-600 hover:border-slate-400')
      }, el(Smartphone, { size:14 }), tel ? 'Vue Slack affichée' : 'Voir le même fil dans Slack'),
      el('div', { className:'h-8 w-8 rounded-full bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center justify-center' },
        MOI.split(' ').map(function (x) { return x[0]; }).join(''))),
    el('div', { className:'flex-1 flex overflow-hidden' },
      el(Conversation, { actifOnglet: actif, ouverts:ouverts, ouvrirOnglet:ouvrirOnglet, msgRefs:msgRefs }),
      el(PanneauDocuments, { ouverts:ouverts, actif:actif, setActif:setActif, fermer:fermer, ouvrirOnglet:ouvrirOnglet, allerAuMessage:allerAuMessage }),
      tel ? el(Telephone, { onClose: function () { setTel(false); } }) : null),
    el('footer', { className:'shrink-0 bg-white border-t border-slate-200 px-5 py-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-500' },
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-teal-500' }), 'À gauche : la conversation — la même que dans Slack, jamais une seconde'),
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-sky-500' }), 'À droite : vos documents et vos maquettes, par onglets'),
      el('span', { className:'inline-flex items-center gap-1' }, el('span', { className:'h-2 w-2 rounded-full bg-slate-400' }), 'Croquis — données fictives · le fil est affiché par le module, Slack n’acceptant pas d’être encastré dans une page'))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(el(App, null));
  </script>
</body>
</html>
